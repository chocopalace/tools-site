<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SNS写真 危険チェック</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    }

    .risk-circle {
      position: absolute;
      border: 4px solid red;
      border-radius: 9999px;
      pointer-events: none;
      box-sizing: border-box;
    }

    .risk-label {
      position: absolute;
      top: -30px;
      left: 0;
      white-space: nowrap;
      color: white;
      font-size: 12px;
      font-weight: bold;
      border-radius: 9999px;
      padding: 4px 10px;
    }
  </style>
</head>

<body class="min-h-screen bg-slate-100 text-slate-900">
  <main class="mx-auto max-w-6xl p-4 md:p-8">
    <section class="mb-6 rounded-3xl bg-white p-6 shadow-sm">
      <h1 class="text-3xl font-bold md:text-5xl">SNS写真 危険チェック</h1>

      <p class="mt-4 text-slate-600">
        写真に写っている顔をAIで検出し、ぼかし加工できます。
      </p>
      <a class="back-link" href="../">← ツール一覧にもどる</a>

      <div class="mt-6 flex flex-wrap gap-3">
        <input id="fileInput" type="file" accept="image/*" class="hidden" />

        <button id="selectBtn" class="rounded-xl bg-blue-600 px-5 py-3 font-bold text-white">
          写真を選ぶ
        </button>


        <button id="resetBtn" class="rounded-xl bg-slate-200 px-5 py-3 font-bold text-slate-700">
          リセット
        </button>

      </div>

      <div class="mt-4 h-2 overflow-hidden rounded-full bg-slate-200">
        <div id="progressBar" class="h-full w-0 bg-blue-600 transition-all"></div>
      </div>

      <p id="statusText" class="mt-3 text-sm font-bold text-slate-700">
        写真を選んでください。
      </p>
    </section>

    <section class="grid gap-6 lg:grid-cols-[1.4fr_0.9fr]">
      <div class="rounded-3xl bg-white p-4 shadow-sm">
        <div class="relative flex min-h-[450px] items-center justify-center rounded-2xl bg-slate-50">
          <div id="emptyState" class="text-center text-slate-400">
            <div class="text-5xl">◎</div>
            <p class="mt-2 font-bold">写真を選択してください</p>
          </div>

          <div id="previewWrap" class="relative hidden w-full overflow-hidden rounded-2xl">
            <img id="previewImage" class="w-full rounded-2xl" alt="選択した写真" />
            <div id="overlay" class="absolute inset-0 pointer-events-none"></div>
          </div>
        </div>

        <div id="photoActionArea" class="mt-4 hidden flex-wrap justify-center gap-3">
          <button id="previewBlurBtn" class="rounded-xl bg-blue-600 px-5 py-3 font-bold text-white disabled:opacity-40" disabled>
            ぼかし画像をプレビュー
          </button>

          <button id="saveBlurBtn" class="rounded-xl bg-green-600 px-5 py-3 font-bold text-white disabled:opacity-40" disabled>
            ぼかし画像を保存
          </button>
        </div>
      </div>

      <aside class="space-y-6">
        <div class="rounded-3xl bg-white p-5 shadow-sm">
          <div class="flex items-center justify-between">
            <h2 class="text-xl font-bold">危険度</h2>
            <span id="riskBadge" class="rounded-full bg-green-50 px-4 py-2 text-sm font-bold text-green-700">
              未チェック
            </span>
          </div>

          <p class="mt-4 text-sm text-slate-600">
            検出数：<span id="riskCount" class="font-bold text-slate-900">0</span>件
          </p>
        </div>

        <div class="rounded-3xl bg-white p-5 shadow-sm">
          <div class="mb-4 flex items-center justify-between gap-2">
            <h2 class="text-xl font-bold">検出結果</h2>

            <div class="flex gap-2">
              <button id="allBlurBtn" class="rounded-lg bg-blue-600 px-3 py-2 text-xs font-bold text-white" disabled>
                すべてぼかす
              </button>
              <button id="allClearBtn" class="rounded-lg bg-slate-200 px-3 py-2 text-xs font-bold text-slate-700" disabled>
                すべて解除
              </button>
            </div>
          </div>

          <div id="riskList" class="space-y-3 text-sm">
            まだ検出結果はありません。
          </div>
        </div>

      </aside>
    </section>
  </main>

  <script>
    

    const fileInput = document.getElementById("fileInput");
    const selectBtn = document.getElementById("selectBtn");
    const resetBtn = document.getElementById("resetBtn");
    const photoActionArea = document.getElementById("photoActionArea");
    const previewBlurBtn = document.getElementById("previewBlurBtn");
    const saveBlurBtn = document.getElementById("saveBlurBtn");
    const allBlurBtn = document.getElementById("allBlurBtn");
    const allClearBtn = document.getElementById("allClearBtn");

    const previewImage = document.getElementById("previewImage");
    const previewWrap = document.getElementById("previewWrap");
    const emptyState = document.getElementById("emptyState");
    const overlay = document.getElementById("overlay");

    const statusText = document.getElementById("statusText");
    const progressBar = document.getElementById("progressBar");
    const riskBadge = document.getElementById("riskBadge");
    const riskCount = document.getElementById("riskCount");
    const riskList = document.getElementById("riskList");

    let selectedFile = null;
    let originalFileName = "sns-photo";
    let imageBase64 = "";
    let risks = [];
    let isBlurPreview = false;

    selectBtn.addEventListener("click", () => fileInput.click());

    fileInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      selectedFile = file;
      originalFileName = file.name || "sns-photo";

      const normalized = await normalizeImage(file);
      imageBase64 = normalized.base64;
      previewImage.src = normalized.dataUrl;

      previewWrap.classList.remove("hidden");
      emptyState.classList.add("hidden");

      previewImage.onload = async () => {
        previewImage.onload = null;
        resetAll();
        photoActionArea.classList.remove("hidden");
        photoActionArea.classList.add("flex");
        setStatus("写真を読み込みました。無料版AIで自動チェック中です...");
        await runFaceOnlyCheck();
      };
    });

    previewBlurBtn.addEventListener("click", previewBlurredImage);
    resetBtn.addEventListener("click", fullReset);
    saveBlurBtn.addEventListener("click", saveBlurredImage);

    allBlurBtn.addEventListener("click", () => {
      risks.forEach(r => r.blur = true);
      renderAll();
    });

    allClearBtn.addEventListener("click", () => {
      risks.forEach(r => r.blur = false);
      renderAll();
    });

    function normalizeImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const reader = new FileReader();

        reader.onload = () => {
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const maxWidth = 1600;

            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);

            const dataUrl = canvas.toDataURL("image/jpeg", 0.92);
            const base64 = dataUrl.split(",")[1];

            resolve({ dataUrl, base64 });
          };

          img.onerror = reject;
          img.src = reader.result;
        };

        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    let mediaPipeDetectorPromise = null;

    async function getMediaPipeDetector() {
      if (!mediaPipeDetectorPromise) {
        mediaPipeDetectorPromise = (async () => {
          const visionModule = await import(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/+esm"
          );
          const vision = await visionModule.FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
          );
          return visionModule.FaceDetector.createFromOptions(vision, {
            baseOptions: {
              modelAssetPath:
                "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/latest/blaze_face_short_range.tflite"
            },
            runningMode: "IMAGE",
            minDetectionConfidence: 0.25,
            minSuppressionThreshold: 0.3
          });
        })();
      }
      return mediaPipeDetectorPromise;
    }

    function overlapRatio(a, b) {
      const left = Math.max(a.x, b.x);
      const top = Math.max(a.y, b.y);
      const right = Math.min(a.x + a.width, b.x + b.width);
      const bottom = Math.min(a.y + a.height, b.y + b.height);
      const intersection = Math.max(0, right - left) * Math.max(0, bottom - top);
      const smallest = Math.min(a.width * a.height, b.width * b.height);
      return smallest > 0 ? intersection / smallest : 0;
    }

    async function runFaceOnlyCheck() {
      risks = [];
      renderAll();
      setProgress(8);

      try {
        setStatus("高精度の顔検出モデルを準備しています...");
        const detector = await getMediaPipeDetector();
        setProgress(25);

        const sourceWidth = previewImage.naturalWidth;
        const sourceHeight = previewImage.naturalHeight;
        const candidates = [];

        const addResults = (result, offsetX, offsetY, scaleX, scaleY) => {
          (result?.detections || []).forEach((detection) => {
            const box = detection.boundingBox;
            if (!box) return;

            const face = {
              x: offsetX + box.originX * scaleX,
              y: offsetY + box.originY * scaleY,
              width: box.width * scaleX,
              height: box.height * scaleY
            };

            const padding = Math.max(face.width, face.height) * 0.18;
            face.x = Math.max(0, face.x - padding);
            face.y = Math.max(0, face.y - padding);
            face.width = Math.min(sourceWidth - face.x, face.width + padding * 2);
            face.height = Math.min(sourceHeight - face.y, face.height + padding * 2);

            if (!candidates.some((old) => overlapRatio(old, face) > 0.55)) {
              candidates.push(face);
            }
          });
        };

        setStatus("写真全体から顔を探しています...");
        addResults(detector.detect(previewImage), 0, 0, 1, 1);
        setProgress(45);

        const tiles = 3;
        const overlap = 0.12;
        let completed = 0;

        for (let row = 0; row < tiles; row++) {
          for (let col = 0; col < tiles; col++) {
            const baseW = sourceWidth / tiles;
            const baseH = sourceHeight / tiles;
            const sx = Math.max(0, col * baseW - baseW * overlap);
            const sy = Math.max(0, row * baseH - baseH * overlap);
            const sw = Math.min(sourceWidth - sx, baseW * (1 + overlap * 2));
            const sh = Math.min(sourceHeight - sy, baseH * (1 + overlap * 2));

            const canvas = document.createElement("canvas");
            const maxSide = 900;
            const resize = Math.min(1, maxSide / Math.max(sw, sh));
            canvas.width = Math.max(1, Math.round(sw * resize));
            canvas.height = Math.max(1, Math.round(sh * resize));
            canvas.getContext("2d").drawImage(
              previewImage,
              sx, sy, sw, sh,
              0, 0, canvas.width, canvas.height
            );

            addResults(
              detector.detect(canvas),
              sx,
              sy,
              sw / canvas.width,
              sh / canvas.height
            );

            completed++;
            setProgress(45 + Math.round((completed / (tiles * tiles)) * 50));
            await new Promise((resolve) => setTimeout(resolve, 0));
          }
        }

        risks = candidates.map((box, index) => ({
          id: `face-${index}`,
          label: "顔",
          memo: "顔が認識できる可能性があります。",
          color: "#ef4444",
          blur: true,
          x: box.x,
          y: box.y,
          w: box.width,
          h: box.height
        }));

        setProgress(100);
        renderAll();
        setStatus(
          risks.length
            ? `解析完了。${risks.length}人分の顔候補を検出しました。`
            : "顔を検出できませんでした。人物が小さい場合は、目視で確認してください。"
        );
      } catch (e) {
        console.error(e);
        const message = e instanceof Error ? e.message : String(e);
        setStatus("エラー：" + message);
      }
    }


    function renderAll() {
      renderCircles();
      renderRiskList();
      updateRiskScore();
    }

    function renderCircles() {
      overlay.innerHTML = "";

      risks.forEach((risk) => {
        const div = document.createElement("div");
        div.className = "risk-circle";
        div.style.borderColor = risk.blur ? risk.color : "#94a3b8";
        div.style.opacity = risk.blur ? "1" : "0.45";

        const naturalW = previewImage.naturalWidth || 1;
        const naturalH = previewImage.naturalHeight || 1;
        const displayW = previewImage.clientWidth || naturalW;
        const displayH = previewImage.clientHeight || naturalH;

        div.style.left = `${(risk.x / naturalW) * displayW}px`;
        div.style.top = `${(risk.y / naturalH) * displayH}px`;
        div.style.width = `${Math.max((risk.w / naturalW) * displayW, 28)}px`;
        div.style.height = `${Math.max((risk.h / naturalH) * displayH, 28)}px`;

        const tag = document.createElement("div");
        tag.className = "risk-label";
        tag.style.background = risk.blur ? risk.color : "#64748b";
        tag.textContent = risk.blur ? risk.label : `${risk.label}：解除`;

        div.appendChild(tag);
        overlay.appendChild(div);
      });
    }

    function renderRiskList() {
      riskList.innerHTML = "";

      if (risks.length === 0) {
        riskList.textContent = "まだ検出結果はありません。";
        previewBlurBtn.disabled = true;
        saveBlurBtn.disabled = true;
        allBlurBtn.disabled = true;
        allClearBtn.disabled = true;
        return;
      }

      risks.forEach((risk, index) => {
        const item = document.createElement("div");
        item.className = "rounded-2xl border border-slate-200 bg-slate-50 p-3";

        item.innerHTML = `
          <div class="flex items-center justify-between gap-3">
            <div class="flex items-start gap-3">
              <img
                src="${createRiskThumbnail(risk)}"
                class="h-16 w-16 shrink-0 rounded-xl border bg-white object-cover"
                alt="検出部分"
              />

              <div>
                <div class="font-bold text-slate-900">${escapeHtml(risk.label)}</div>
                <div class="mt-1 text-slate-600">${escapeHtml(risk.memo)}</div>
              </div>
            </div>

            <button
              class="blur-toggle shrink-0 rounded-xl px-3 py-2 text-xs font-bold ${
                risk.blur
                  ? "bg-blue-600 text-white"
                  : "border border-slate-300 bg-white text-slate-700"
              }"
              data-index="${index}"
            >
              ${risk.blur ? "ぼかす" : "ぼかさない"}
            </button>
          </div>
        `;

        riskList.appendChild(item);
      });

      document.querySelectorAll(".blur-toggle").forEach((button) => {
        button.addEventListener("click", () => {
          const index = Number(button.dataset.index);
          risks[index].blur = !risks[index].blur;
          renderAll();
        });
      });

      previewBlurBtn.disabled = false;
      saveBlurBtn.disabled = false;
      allBlurBtn.disabled = false;
      allClearBtn.disabled = false;
    }

    function createRiskThumbnail(risk) {
      const canvas = document.createElement("canvas");
      const size = 96;
      canvas.width = size;
      canvas.height = size;

      const ctx = canvas.getContext("2d");

      const padding = Math.max(8, Math.min(risk.w, risk.h) * 0.35);

      const sx = Math.max(0, risk.x - padding);
      const sy = Math.max(0, risk.y - padding);
      const sw = Math.min(previewImage.naturalWidth - sx, risk.w + padding * 2);
      const sh = Math.min(previewImage.naturalHeight - sy, risk.h + padding * 2);

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, size, size);

      ctx.drawImage(
        previewImage,
        sx,
        sy,
        sw,
        sh,
        0,
        0,
        size,
        size
      );

      return canvas.toDataURL("image/jpeg", 0.85);
    }

    function updateRiskScore() {
      riskCount.textContent = risks.length;

      if (risks.length === 0) {
        riskBadge.textContent = "低";
        riskBadge.className = "rounded-full bg-green-50 px-4 py-2 text-sm font-bold text-green-700";
      } else if (risks.length <= 3) {
        riskBadge.textContent = "中";
        riskBadge.className = "rounded-full bg-yellow-50 px-4 py-2 text-sm font-bold text-yellow-700";
      } else {
        riskBadge.textContent = "高";
        riskBadge.className = "rounded-full bg-red-50 px-4 py-2 text-sm font-bold text-red-700";
      }
    }

    function createBlurredCanvas() {
      const canvas = document.createElement("canvas");
      canvas.width = previewImage.naturalWidth;
      canvas.height = previewImage.naturalHeight;

      const ctx = canvas.getContext("2d");
      ctx.drawImage(previewImage, 0, 0, canvas.width, canvas.height);

      risks.filter(r => r.blur).forEach((risk) => {
        const padding = 2;
        applyMosaicBlur(
          ctx,
          risk.x - padding,
          risk.y - padding,
          risk.w + padding * 2,
          risk.h + padding * 2
        );
      });

      return canvas;
    }

    function previewBlurredImage() {
      if (!previewImage.src || risks.length === 0) return;

      if (!isBlurPreview) {
        const canvas = createBlurredCanvas();
        previewImage.dataset.originalSrc = previewImage.src;
        previewImage.src = canvas.toDataURL("image/png");
        overlay.classList.add("hidden");
        previewBlurBtn.textContent = "元の写真に戻す";
        isBlurPreview = true;
        setStatus("ぼかし後の画像をプレビュー中です。保存すると、この状態の画像を保存します。");
      } else {
        previewImage.src = previewImage.dataset.originalSrc || previewImage.src;
        overlay.classList.remove("hidden");
        previewBlurBtn.textContent = "ぼかし画像をプレビュー";
        isBlurPreview = false;
        setStatus("元の写真表示に戻しました。検出箇所を確認できます。きいろいボタンでぼかす/ぼかさないを選べます。");
      }
    }

    function saveBlurredImage() {
      if (!previewImage.src || risks.length === 0) return;

      const currentPreview = isBlurPreview;
      if (currentPreview) {
        previewImage.src = previewImage.dataset.originalSrc || previewImage.src;
      }

      const canvas = createBlurredCanvas();

      if (currentPreview) {
        previewImage.src = canvas.toDataURL("image/png");
      }

      const link = document.createElement("a");
      link.download = createUniqueDownloadName(originalFileName);
      link.href = canvas.toDataURL("image/png");
      link.click();

      setStatus("ぼかし画像を保存しました。ファイル名は毎回変わるので、前の保存画像に上書きされにくくなっています。");
    }

    function createUniqueDownloadName(fileName) {
      const base = String(fileName || "sns-photo")
        .replace(/\.[^/.]+$/, "")
        .replace(/[\\/:*?"<>|]/g, "-")
        .trim() || "sns-photo";

      const now = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      const stamp = [
        now.getFullYear(),
        pad(now.getMonth() + 1),
        pad(now.getDate())
      ].join("") + "_" + [
        pad(now.getHours()),
        pad(now.getMinutes()),
        pad(now.getSeconds())
      ].join("");

      return `${base}_blurred_${stamp}.png`;
    }

    function applyMosaicBlur(ctx, x, y, w, h) {
      const safeX = Math.max(0, Math.floor(x));
      const safeY = Math.max(0, Math.floor(y));
      const safeW = Math.min(ctx.canvas.width - safeX, Math.ceil(w));
      const safeH = Math.min(ctx.canvas.height - safeY, Math.ceil(h));

      if (safeW <= 0 || safeH <= 0) return;

      const scale = 0.06;
      const smallW = Math.max(1, Math.floor(safeW * scale));
      const smallH = Math.max(1, Math.floor(safeH * scale));

      const tempCanvas = document.createElement("canvas");
      tempCanvas.width = smallW;
      tempCanvas.height = smallH;

      const tempCtx = tempCanvas.getContext("2d");
      tempCtx.imageSmoothingEnabled = true;
      tempCtx.drawImage(ctx.canvas, safeX, safeY, safeW, safeH, 0, 0, smallW, smallH);

      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(tempCanvas, 0, 0, smallW, smallH, safeX, safeY, safeW, safeH);
      ctx.imageSmoothingEnabled = true;
    }

    function setProgress(value) {
      progressBar.style.width = `${value}%`;
    }

    function setStatus(message) {
      statusText.textContent = message;
    }

    function resetAll() {
      risks = [];
      overlay.innerHTML = "";
      riskList.textContent = "まだ検出結果はありません。";
      riskCount.textContent = "0";
      riskBadge.textContent = "未チェック";
      riskBadge.className = "rounded-full bg-green-50 px-4 py-2 text-sm font-bold text-green-700";
      isBlurPreview = false;
      overlay.classList.remove("hidden");
      previewBlurBtn.textContent = "ぼかし画像をプレビュー";
      previewBlurBtn.disabled = true;
      saveBlurBtn.disabled = true;
      allBlurBtn.disabled = true;
      allClearBtn.disabled = true;
      setProgress(0);
    }

    function fullReset() {
      selectedFile = null;
      imageBase64 = "";
      fileInput.value = "";
      previewImage.removeAttribute("src");
      previewImage.removeAttribute("data-original-src");
      previewWrap.classList.add("hidden");
      emptyState.classList.remove("hidden");
      photoActionArea.classList.add("hidden");
      photoActionArea.classList.remove("flex");
      resetAll();
      setStatus("写真を選んでください。");
    }

    function escapeHtml(text) {
      return String(text || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    window.addEventListener("resize", renderCircles);
  </script>
</body>
</html>
